<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Investor sign in | Lifeline Care Supply</title><link rel="stylesheet" href="/auth.css"><script src="/auth.js" defer></script></head><body><main class="auth-shell"><a class="auth-brand" href="/"><span class="brand-mark">L</span><span class="brand-copy">Lifeline Care Supply<small>INVESTOR ACCESS</small></span></a><section class="auth-card"><div class="eyebrow">WELCOME BACK</div><h1>Sign in to your account.</h1><p class="intro">Use your registered mobile number and password to access your personal investor workspace.</p><form data-auth-form="login"><div class="field"><label for="phone">Mobile number</label><input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="+2567XXXXXXXX" required pattern="\+[1-9][0-9]{7,14}"><span class="hint">Include your country code, for example +256.</span></div><div class="field"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required></div><button class="submit" type="submit">Sign in</button><div class="message" role="status" aria-live="polite"></div></form><p class="switch">New to Lifeline? <a href="/register/">Create an account</a></p></section><a class="back" href="/">← Back to website</a></main></body></html>
